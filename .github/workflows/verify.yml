# This profile had no CI at all until now: CONTRIBUTING said "before pushing,
# run make verify", and nothing enforced it. The checks it names catch link rot
# and references to repositories that stopped being public -- failures that
# arrive on their own schedule, from renames and visibility changes made in
# *other* repositories, long after the last commit here. So this runs on every
# change and also weekly, because a profile nobody has pushed to in a month is
# exactly the one whose links have gone stale.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 14:05 UTC. Off the hour, because the top of the hour is when
    # every scheduled job on GitHub queues at once.
    - cron: "5 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lint Markdown
        run: make lint

      - name: Check that every link resolves for a logged-out visitor
        run: make links

      # `make names` has two halves, and only one of them needs a privileged
      # token. Until 2026-08-28 a missing INVENTORY_TOKEN skipped BOTH, so on
      # every run since the workflow was added this step exited 0 having
      # checked nothing at all -- no secret has ever been configured on this
      # repository. That is the exact shape of check this profile keeps saying
      # it will not ship.
      #
      # The half that needs nothing: every linked repository is public and not
      # archived. `--links-only` asks the public API about each linked slug,
      # using GITHUB_TOKEN for rate limit only and never to see more than a
      # stranger would. It now runs on every build, and it fails.
      - name: Check that every linked repository is public and not archived
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_repo_names.py --links-only

      # The half that does need a token: bare project names sitting in prose
      # with no URL attached, after that project stops being public. The
      # default GITHUB_TOKEN cannot see private repositories -- it would list
      # only the public ones, report no error, and pass having watched for
      # nothing -- and check_repo_names refuses an empty watchlist for that
      # reason. Create a fine-grained PAT with read access to repository
      # metadata across all repositories and save it as INVENTORY_TOKEN.
      - name: Check that no Markdown names a non-public repository
        env:
          GH_TOKEN: ${{ secrets.INVENTORY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=the bare-name half of make names did not run::No INVENTORY_TOKEN secret is set. The linked-repository half ran in the previous step; this is the half that catches a bare project name in prose after that project stops being public. Run 'make names' locally, or add the secret. This is a gap, not a pass."
            exit 0
          fi
          make names
